version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing dependencies..."
      # UPDATED: Command is now on a single line to prevent YAML syntax errors
      - pip install --platform manylinux2014_x86_64 --target=lib --implementation cp --python-version 3.11 --only-binary=:all: --upgrade -r requirements.txt
  build:
    commands:
      - echo "Zipping deployment package..."
      - cd lib
      - zip -r9 ../deployment_package.zip .
      - cd ..
      - zip -g deployment_package.zip lambda_function.py
  post_build:
    commands:
      - echo "Uploading to S3..."
      - aws s3 cp deployment_package.zip s3://lambda-builds-zip-0/ 
      - echo "Updating Lambda function via S3..."
      - aws lambda update-function-code --function-name github-to-lambda-cicd --s3-bucket lambda-builds-zip-0 --s3-key deployment_package.zip
      - echo "Deployment complete!"